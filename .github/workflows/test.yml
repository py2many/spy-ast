name: Run test suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Set up V
      shell: bash
      env:
        V_VERSION: "0.5.1"
      run: |
        url="https://github.com/vlang/v/releases/download/${V_VERSION}/v_linux.zip"
        curl -fsSL "$url" -o "$RUNNER_TEMP/v.zip"
        unzip -q "$RUNNER_TEMP/v.zip" -d "$RUNNER_TEMP/vlang"
        echo "$RUNNER_TEMP/vlang/v" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/vlang/v/v" version
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pytest
    - name: Pytest
      run: pytest tests_vlang_parser
